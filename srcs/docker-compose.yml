name: inception

services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:1.0
    container_name: mariadb
    env_file: .env
    secrets: [db_password, db_root_password]
    volumes:
      - mariadb_data:/var/lib/mysql
    networks: [inception]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mariadb-admin', 'ping', '-h', 'localhost', '--silent']
      interval: 5s
      timeout: 3s
      retries: 20

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:1.0
    container_name: wordpress
    env_file: .env
    secrets: [db_password, wp_admin_password, wp_user_password]
    volumes:
      - wordpress_data:/var/www/html
    networks: [inception]
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build: ./requirements/nginx
    image: nginx:1.0
    container_name: nginx
    env_file: .env
    ports:
      - '443:443'
    volumes:
      - wordpress_data:/var/www/html:ro
    networks: [inception]
    depends_on: [wordpress]
    restart: unless-stopped

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
